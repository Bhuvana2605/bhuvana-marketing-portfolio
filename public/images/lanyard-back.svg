  <rect x="24" y="24" width="552" height="852" rx="32" fill="none" stroke="#b5f0a0" stroke-opacity=".65" stroke-width="3"/>
  <text x="60" y="170" fill="#b5f0a0" font-family="Georgia,serif" font-style="italic" font-size="42">A note to self</text>
  <text x="60" y="320" fill="#f0f8c9" font-family="Georgia,serif" font-style="italic" font-size="60">Make it</text>
